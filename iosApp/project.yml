name: NusaNews
options:
  bundleIdPrefix: com.ahmaddody
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  NusaNews:
    type: application
    platform: iOS
    sources:
      - path: NusaNews
    configFiles:
      Debug: Configuration/Config.xcconfig
      Release: Configuration/Config.xcconfig
    info:
      path: NusaNews/Info.plist
      properties:
        CFBundleDisplayName: Nusa News
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NewsApiKey: $(NEWS_API_KEY)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebasePerformance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmaddody.newsreader.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - NusaNewsShared
    postBuildScripts:
      - name: Upload Crashlytics dSYMs
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - $(SRCROOT)/$(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)
        script: |
          # Kotlin/Native emits its own .dSYM for the shared framework; without this upload an iOS
          # crash inside shared code is unsymbolicated and therefore not actionable.
          RUN_SCRIPT="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ -f "$RUN_SCRIPT" ]; then
            "$RUN_SCRIPT"
          else
            echo "warning: Crashlytics run script not found; resolve the Firebase package first."
          fi
    preBuildScripts:
      - name: Build and embed shared KMP framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
