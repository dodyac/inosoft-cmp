[versions]
agp = "9.1.0"
kotlin = "2.4.10"
ksp = "2.3.10"
room3 = "3.0.1"
sqlite = "2.7.0"
coroutines = "1.11.0"
serializationJson = "1.11.0"
datetime = "0.8.0"
ktor = "3.5.1"
koin = "4.2.1"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
androidxCore = "1.13.1"
navigation = "2.9.8"
coil = "3.5.0"
junit = "4.13.2"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"
firebaseBom = "34.19.0"
googleServices = "4.5.0"
